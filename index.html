    .grid4{grid-template-columns:1fr 1fr}

    .app-root{height:auto!important;overflow:visible!important}
    .app-content{overflow:visible!important;padding:0!important}
    .cols{grid-template-columns:1fr 1fr}
  }

// EPA size class (fueleconomy.gov "VClass") → Kept body type
function vclassToBody(vc, make) {
  const c = String(vc || "").toLowerCase();
  const lux = CONFIG.luxuryMakes.some(m => m.toLowerCase() === String(make || "").toLowerCase());
  if (/standard pickup/.test(c)) return "pickup";
  if (/small pickup|pickup/.test(c)) return "smallpickup";
  if (/minivan/.test(c)) return "minivan";
  if (/van/.test(c)) return "van";
  if (/standard sport utility|sport utility vehicle - 4wd|special purpose/.test(c)) return "suv";
  if (/small sport utility|sport utility/.test(c)) return "smallsuv";
  if (/large|midsize/.test(c)) return lux ? "lux" : "midsize";
  if (/compact|subcompact|minicompact|two seater|wagon/.test(c)) return lux ? "lux" : "compact";
  return "midsize";
}

function computePeriod(data, from, to) {

}

// per-app breakdown for the dashboard: earned, each cost line, tax set-aside and what you keep
function appBreakdown(data, from, to, rate) {

  const t = text.replace(/\s+/g, " ");
  let m = t.match(/(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) out.date = m[1] + "-" + pad(+m[2]) + "-" + pad(+m[3]);
  else if ((m = t.match(/\b(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})\b/))) {
    let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
    let mo = country === "US" ? a : b, d = country === "US" ? b : a;
    if (mo > 12 && d <= 12) { const tmp = mo; mo = d; d = tmp; }
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && y >= 2015 && y <= 2100) out.date = y + "-" + pad(mo) + "-" + pad(d);
  }
  if ((m = t.match(/(\d{1,3}[.,]\d{1,3})\s*(l|ltr|liter|litre|lt)\b/i))) out.qty = parseAmount(m[1]);
  else if ((m = t.match(/(\d{1,3}[.,]\d{1,3})\s*(gal|gallons?)\b/i))) out.qty = +(parseAmount(m[1]) * L_PER_GAL).toFixed(2);
  else if ((m = t.match(/(\d{1,3}(?:[.,]\d{1,3})?)\s*kwh/i))) out.qty = parseAmount(m[1]);
  const low = t.toLowerCase();
  if (/(kwh|charg|laadpaal|fastned|ionity|supercharg|electrify|allego|shell recharge)/.test(low)) out.category = "electricity";
  else if (/(shell|\bbp\b|esso|tinq|tango|totalenergies|texaco|chevron|exxon|mobil|wawa|sheetz|speedway|circle k|benzine|euro ?95|diesel|unleaded|gasoline|\bfuel\b|petrol|opet|\baral\b|argos|gulf|sunoco|marathon|valero|quiktrip|costco gas)/.test(low)) out.category = "fuel";
  else if (/(parking|parkeren|parkeer|\btoll|\btol\b|otopark|ez-?pass|sunpass)/.test(low)) out.category = "parking";
  else if (/(tire|tyre|banden|lastik|brake|remblok|oil change|jiffy|halfords|bike shop|fietsenmaker)/.test(low)) out.category = "maintenance";
  else if (/(vodafone|kpn|t-mobile|odido|verizon|at&t|turkcell|lebara|simyo)/.test(low)) out.category = "phone";
  return out;
}

async function apiCall(pin, action, extra) {
  const res = await fetch(CONFIG.apiUrl, { method: "POST", body: JSON.stringify(Object.assign({ pin, action }, extra || {})) });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function PhotoThumb({ id, pin, size, onOpen, onRemove }) {
  const [url, setUrl] = useState(null);
  const [state, setState] = useState("load");
  useEffect(() => {
    let alive = true, made = null;
    (async () => {
      try {
        let blob = await IDB.get(id);
        if (!blob && CONFIG.apiUrl && pin) {
          const r = await apiCall(pin, "getPhoto", { id });
          if (r && r.data) { blob = b64ToBlob(r.data, r.mime); IDB.put(id, blob).catch(() => {}); }
        }
        if (!alive) return;
        if (blob) { made = URL.createObjectURL(blob); setUrl(made); setState("ok"); } else setState("missing");
      } catch (x) { if (alive) setState("missing"); }
    })();
    return () => { alive = false; if (made) URL.revokeObjectURL(made); };
  }, [id]);
  const sz = size || 72;
  return e("div", { style: { position: "relative", width: sz, height: sz, borderRadius: 10, overflow: "hidden", background: C.input, border: "1px solid " + C.border, flexShrink: 0, cursor: url ? "pointer" : "default" }, onClick: () => url && onOpen && onOpen(url) },

const EMPTY_DATA = { settings: Object.assign({}, CONFIG.defaults), vehicles: [], shifts: [], expenses: [], trips: [] };

// ════════════════════════════════════════════════════════════════
//  APP
// ════════════════════════════════════════════════════════════════
function App() {
  // ── state (all hooks first) ──
  const localMode = !CONFIG.apiUrl;
  const [pin, setPin] = useState(LS.get("kept_pin", ""));
  const [authed, setAuthed] = useState(localMode);
  const [loginErr, setLoginErr] = useState("");
  const [loading, setLoading] = useState(false);
  const [raw, setData] = useState(() => {
    const d = LS.get("kept_data", null);
    return d ? Object.assign({}, EMPTY_DATA, d, { settings: Object.assign({}, CONFIG.defaults, d.settings || {}) }) : EMPTY_DATA;
  });
  // derived view: gig trips become sessions ("shifts") so every engine works on one list
  const data = useMemo(() => Object.assign({}, raw, { trips: raw.trips || [], shifts: (raw.shifts || []).concat(tripsToShifts(raw.trips || [])) }), [raw]);
  const [view, setView] = useState("home");
  const [modal, setModal] = useState(null);
  const [toast, setToast] = useState(null);
  const [tick, setTick] = useState(0);
  const [syncState, setSyncState] = useState(localMode ? "local" : "idle");
  const [homePeriod, setHomePeriod] = useState("today");
  const [viewer, setViewer] = useState(null);
  const [brief, setBrief] = useState(LS.get("kept_brief", null));
  const [briefBusy, setBriefBusy] = useState(false);
  const watchRef = useRef(null);
  const wakeRef = useRef(null);
  const flushingRef = useRef(false);
  const pinRef = useRef(pin);
  pinRef.current = pin;
  const dataRef = useRef(data);
  dataRef.current = data;
  // stable component identities: views/modals are defined inside App (closures), but React must
  // see the same component type every render or it remounts them (losing form state on every tick)
  const implRef = useRef({});
  const stableRef = useRef({});
  const stable = (name, fn) => {
    implRef.current[name] = fn;
    if (!stableRef.current[name]) { const W = props => implRef.current[name](props); W.displayName = name; stableRef.current[name] = W; }
    return stableRef.current[name];
  };

  const st = data.settings;
  const L = Math.max(0, CONFIG.languages.findIndex(l => l[0] === st.lang));
  const T = k => { const r = I18N[k]; return r ? (r[L] || r[0]) : k; };
  const locale = LOCALES[st.lang] || "en-US";
  const money = (v, dec) => { try { return new Intl.NumberFormat(locale, { style: "currency", currency: st.currency || "EUR", maximumFractionDigits: dec == null ? 2 : dec, minimumFractionDigits: dec == null ? 2 : dec }).format(v || 0); } catch (x) { return (v || 0).toFixed(2); } };
  const pct = v => Math.round((v || 0) * 1000) / 10 + "%";
  const unit = st.unit === "mi" ? "mi" : "km";
  const dist = km => (unit === "mi" ? km / KM_PER_MI : km);
  const toKm = v => (unit === "mi" ? num(v) * KM_PER_MI : num(v));
  const fmtDist = (km, dec) => dist(km).toLocaleString(locale, { maximumFractionDigits: dec == null ? 1 : dec, minimumFractionDigits: dec == null ? 1 : dec }) + " " + unit;
  const perUnit = perKm => (unit === "mi" ? perKm * KM_PER_MI : perKm);
  const vmap = useMemo(() => { const m = {}; data.vehicles.forEach(v => m[v.id] = v); return m; }, [data.vehicles]);
  const vName = v => v ? (v.name || T("t_" + v.type)) : "—";

  // ── persistence ──
  useEffect(() => { LS.set("kept_data", raw); }, [raw]);
  useEffect(() => { document.documentElement.lang = st.lang || "en"; }, [st.lang]);

  const showToast = (msg) => { setToast({ msg }); setTimeout(() => setToast(null), 2400); };

  // ── sync queue (records) + photo upload queue ──
  const flushPhotos = async () => {
    const q = LS.get("kept_photoQ", []);
    for (const id of q) {
      const blob = await IDB.get(id).catch(() => null);
      if (blob) await apiCall(pinRef.current, "savePhoto", { id, data: await blobToB64(blob), mime: blob.type || "image/jpeg" });
      LS.set("kept_photoQ", LS.get("kept_photoQ", []).filter(x => x !== id));
    }
  };
  const flush = async () => {
    if (localMode || flushingRef.current || !pinRef.current) return;
    flushingRef.current = true; setSyncState("syncing");
    try {
      const q = LS.get("kept_queue", []);
      if (q.length) {
        await apiCall(pinRef.current, "batch", { ops: q });
        LS.set("kept_queue", LS.get("kept_queue", []).slice(q.length));
      }
      await flushPhotos();
      setSyncState(LS.get("kept_queue", []).length || LS.get("kept_photoQ", []).length ? "idle" : "synced");
    } catch (err) {
      setSyncState("offline");
    } finally { flushingRef.current = false; }
  };
  const enqueue = op => { if (localMode) return; const q = LS.get("kept_queue", []); q.push(op); LS.set("kept_queue", q); setTimeout(flush, 50); };
  useEffect(() => {
    if (localMode || !authed) return;
    const on = () => flush();
    window.addEventListener("online", on);
    const iv = setInterval(flush, 60000);
    return () => { window.removeEventListener("online", on); clearInterval(iv); };
  }, [authed]);

  const upsert = (coll, rec) => {
    setData(d => { const list = d[coll].slice(); const i = list.findIndex(x => x.id === rec.id); if (i >= 0) list[i] = rec; else list.push(rec); return Object.assign({}, d, { [coll]: list }); });
    enqueue({ op: "upsert", collection: coll, record: rec });
  };
  const remove = (coll, id) => {
    const rec = dataRef.current[coll].find(x => x.id === id);
    ((rec && rec.photos) || []).forEach(p => IDB.del(p).catch(() => {}));
    setData(d => Object.assign({}, d, { [coll]: d[coll].filter(x => x.id !== id) }));
    enqueue({ op: "remove", collection: coll, id });
  };
  const saveSettings = patch => {
    const ns = Object.assign({}, dataRef.current.settings, patch);
    setData(d => Object.assign({}, d, { settings: ns }));
    enqueue({ op: "settings", settings: ns });
  };
  // store a photo locally now, upload to Drive in the background
  const storePhoto = async (file, stamp) => {
    const blob = await compressImage(file, stamp);
    const id = "ph_" + genId();
    await IDB.put(id, blob);
    if (!localMode) { const q = LS.get("kept_photoQ", []); q.push(id); LS.set("kept_photoQ", q); setTimeout(flush, 100); }
    return { id, blob };
  };

  // ── login ──
  const doLogin = async p => {
    setLoading(true); setLoginErr("");
    try {
      pinRef.current = p;
      await flush();
      const res = await apiCall(p, "getAll");
      setData({ settings: Object.assign({}, CONFIG.defaults, res.settings || {}), vehicles: res.vehicles || [], shifts: res.shifts || [], expenses: res.expenses || [], trips: res.trips || [] });
      setPin(p); LS.set("kept_pin", p); setAuthed(true); setSyncState("synced");
    } catch (err) {
      if (/Unauthorized/i.test(err.message)) { setLoginErr(T("wrongPin")); LS.del("kept_pin"); }
      else if (LS.get("kept_data", null)) { setPin(p); setAuthed(true); setSyncState("offline"); }
      else setLoginErr(err.message);
    } finally { setLoading(false); }
  };
  useEffect(() => { if (!localMode && pin && !authed) doLogin(pin); }, []);

  // ── live fuel prices (cloud only, every 3 days) ──
  const fetchFuel = async () => {
    const r = await apiCall(pinRef.current, "fuelPrice", { country: dataRef.current.settings.country, state: dataRef.current.settings.state });
    LS.set("kept_fuel", Object.assign({ fetched: Date.now() }, r));
    return r;
  };
  const applyFuel = r => {
    let n = 0;
    dataRef.current.vehicles.forEach(v => {
      if (v.energy !== "fuel") return;
      const per = v.fuelType === "diesel" ? r.diesel : r.petrol;
      if (!(per > 0)) return;
      const perL = r.unit === "gal" ? per / L_PER_GAL : per;
      if (Math.abs(perL - num(v.price)) > 0.001) { upsert("vehicles", Object.assign({}, v, { price: +perL.toFixed(4) })); n++; }
    });
    return n;
  };
  useEffect(() => {
    if (localMode || !authed || !st.autoFuel || st.country === "OTHER") return;
    if (!dataRef.current.vehicles.some(v => v.energy === "fuel")) return;
    const last = LS.get("kept_fuel", null);
    if (last && Date.now() - last.fetched < 3 * 86400000) return;
    fetchFuel().then(r => { if (applyFuel(r)) showToast("⛽ " + T("liveFuel") + " ✓"); }).catch(() => {});
  }, [authed]);

  // ── always-on tracking (v4) ──
  // Every mile is logged as a trip: Personal, online for an app (between orders), or on an order (Start ride → Complete ride).
  // In the Android app (Capacitor plugin "KeptNative") the native service does this in the background and detects orders
  // from gig-app notifications; the web tracker then stays off and just shows the native status.
  const IDLE_MS = 10 * 60000;
  const KN = () => (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeptNative) || null;
  const nativeRef = useRef(null);
  const trackRef = useRef(LS.get("kept_track", null));
  const [, setTrackV] = useState(0);
  const track = trackRef.current;
  const commit = t => { trackRef.current = t; if (t) LS.set("kept_track", t); else LS.del("kept_track"); setTrackV(x => x + 1); };
