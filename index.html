const { useState, useEffect, useRef, useMemo } = React;
const e = React.createElement;
const KM_PER_MI = 1.609344;
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (x) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (x) {} },
  del(k) { try { localStorage.removeItem(k); } catch (x) {} },
};
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const dISO = d => { const z = new Date(d); return z.getFullYear() + "-" + pad(z.getMonth() + 1) + "-" + pad(z.getDate()); };
const tHM = d => { const z = new Date(d); return pad(z.getHours()) + ":" + pad(z.getMinutes()); };
const num = v => { const n = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isFinite(n) ? n : 0; };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtDur = mins => { mins = Math.max(0, Math.round(mins)); return Math.floor(mins / 60) + "h " + pad(mins % 60) + "m"; };
const haversine = (a, b) => {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
};
const LOCALES = { en: "en-US", nl: "nl-NL", tr: "tr-TR" };

// money / gross for a shift
const shiftGross = s => sum(s.platforms || [], p => num(p.base) + num(p.tips) + num(p.bonus));
const shiftTips  = s => sum(s.platforms || [], p => num(p.tips));
const shiftFees  = s => sum(s.platforms || [], p => num(p.fees));
const shiftMins  = s => Math.max(0, (new Date(s.end) - new Date(s.start)) / 60000);

// vehicle cost model (per km, internal unit is always km)
function vehicleCost(v) {
  if (!v) return { dep: 0, energy: 0, battery: 0, parts: 0, total: 0, fixed: 0 };
  const dep = num(v.lifeKm) > 0 ? Math.max(0, num(v.purchase) - num(v.resale)) / num(v.lifeKm) : 0;
  const energy = v.energy === "none" ? 0 : num(v.cons) * num(v.price) / 100;
  const battery = num(v.battKm) > 0 ? num(v.battPrice) / num(v.battKm) : 0;
  const parts = sum(v.parts || [], p => num(p.interval) > 0 ? num(p.cost) / num(p.interval) : 0);
  const fixed = num(v.insurance) + num(v.rent) + num(v.otherFixed);
  return { dep, energy, battery, parts, total: dep + energy + battery + parts, fixed };
}
function presetVehicle(type) {
  const p = CONFIG.vehicleTypes[type];
  return {
    id: genId(), type, name: "", active: true, privateOwned: true,
    purchase: p.purchase, resale: p.resale, lifeKm: p.lifeKm, energy: p.energy, cons: p.cons, price: p.price,
    battPrice: p.battPrice, battKm: p.battKm, startOdo: 0,
    insurance: p.fixed.insurance, rent: p.fixed.rent, otherFixed: p.fixed.other,
    parts: p.parts.map(x => ({ id: genId(), name: x[0], cost: x[1], interval: x[2], lastAt: 0 })),
  };
}

// period ranges
function periodRange(key, ref) {
  const now = ref ? new Date(ref) : new Date();

// core economics for a date range
function computePeriod(data, from, to) {
  const { shifts, expenses, vehicles, settings } = data;
  const vmap = {}; vehicles.forEach(v => vmap[v.id] = v);
  const S = shifts.filter(s => s.date >= from && s.date <= to);
  const E = expenses.filter(x => x.date >= from && x.date <= to);
  const catV = {}; CONFIG.expenseCategories.forEach(c => catV[c.id] = c.vehicle);
  const gross = sum(S, shiftGross), tips = sum(S, shiftTips), fees = sum(S, shiftFees);
  const mins = sum(S, shiftMins), km = sum(S, s => num(s.km)), emptyKm = sum(S, s => num(s.emptyKm));
  const varCost = sum(S, s => num(s.km) * vehicleCost(vmap[s.vehicleId]).total);
  const depCost = sum(S, s => num(s.km) * vehicleCost(vmap[s.vehicleId]).dep);
  // fixed vehicle costs, pro-rata per calendar day — only from the first logged shift onward
  let firstDay = shifts.length ? shifts.reduce((m, s) => s.date < m ? s.date : m, shifts[0].date) : to;
  const effFrom = from > firstDay ? from : firstDay;
  const days = (!shifts.length || effFrom > to) ? 0 : daysBetween(effFrom, to);
  const fixed = sum(vehicles.filter(v => v.active !== false), v => vehicleCost(v).fixed) * days / 30.44;
  const vehExp = sum(E.filter(x => catV[x.category]), x => num(x.amount));
  const otherExp = sum(E.filter(x => !catV[x.category]), x => num(x.amount));
  const vehicleCosts = settings.costMode === "actual" ? vehExp + depCost : varCost + fixed;
  const costs = vehicleCosts + otherExp;
  const net = gross - fees - costs;
  return { S, E, gross, tips, fees, mins, km, emptyKm, varCost, fixed, vehExp, otherExp, vehicleCosts, costs, net,
           perHour: mins > 0 ? net / (mins / 60) : 0, per100: km > 0 ? net / km * 100 : 0, days };
}

function taxRateFor(country, date) {
  const t = CONFIG.tax[country]; if (!t) return null;
  const r = t.rates.find(x => date >= x.from && date <= x.to);
  if (r) return { rate: r.rate, confirmed: true };
  const last = t.rates[t.rates.length - 1];
  return { rate: last.rate, confirmed: false };
}
