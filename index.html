<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body,#root{height:100%}
  body{background:var(--bg,#0B1220);color:var(--text,#EAF2FF);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  input,select,textarea,button{font-family:inherit}
  button:disabled{opacity:.5;cursor:default}
  select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7F93B5 50%),linear-gradient(135deg,#7F93B5 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px!important}
  input[type=range]{width:100%;accent-color:#10B981}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--thumb,#1E2A44);border-radius:8px}
  .bottom-nav{display:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .tap:active{transform:scale(.98)}
  :focus-visible{outline:3px solid #2EE6A6;outline-offset:2px;border-radius:8px}
  @media(prefers-reduced-motion:reduce){.pulse,.spin{animation:none}.tap:active{transform:none}}
  .bigtile{min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
  .pulse{animation:pulse 1.6s infinite}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,230,166,.5)}70%{box-shadow:0 0 0 10px rgba(46,230,166,0)}100%{box-shadow:0 0 0 0 rgba(46,230,166,0)}}
  @media(max-width:760px){
    .desktop-sidebar{display:none!important}
    .bottom-nav{display:flex}
    .cols{grid-template-columns:1fr}
    .grid4{grid-template-columns:1fr 1fr}
    .hide-m{display:none!important}
  }
  @media print{
    .desktop-sidebar,.bottom-nav,.no-print,header{display:none!important}
    body,#root{background:#fff!important;color:#000!important;height:auto}
    .print-area *{color:#000!important;background:transparent!important;border-color:#bbb!important}
    .app-root{height:auto!important;overflow:visible!important}
    .app-content{overflow:visible!important;padding:0!important}
    .cols{grid-template-columns:1fr 1fr}
  }
</style>

// EPA size class (fueleconomy.gov "VClass") → Kept body type
function vclassToBody(vc, make) {
  const c = String(vc || "").toLowerCase();
  const lux = CONFIG.luxuryMakes.some(m => m.toLowerCase() === String(make || "").toLowerCase());
  if (/standard pickup/.test(c)) return "pickup";
  if (/small pickup|pickup/.test(c)) return "smallpickup";
  if (/minivan/.test(c)) return "minivan";

  ca_how:["How Coach works","Hoe de coach werkt","Koç nasıl çalışır"],
  ca_howTxt:["Every answer is calculated from your own trips, income and expenses with fixed formulas — nothing is guessed. Burnout Meter: hours in the last 7 days (up to 40 points), days in a row (25), hours today (20) and share of night work 10pm–5am (15). Planner: monthly living costs ÷ (1 − your tax rate) ÷ work days. Today's Brief: if the AI brief is on, Google Gemini receives only totals (earnings, hours, distance, targets) — never your name, trips or locations — and writes a short summary; without it Kept writes the summary itself.","Elk antwoord komt uit je eigen gegevens met vaste formules.","Her cevap kendi yolculuk, gelir ve gider kayıtlarınızdan sabit formüllerle hesaplanır — hiçbir şey tahmin edilmez. Tükenmişlik ölçer: son 7 gündeki saatler (40 puana kadar), arka arkaya günler (25), bugünkü saatler (20) ve 22:00–05:00 gece çalışması payı (15). Planlayıcı: aylık yaşam giderleri ÷ (1 − vergi oranınız) ÷ çalışma günleri. Günün özeti: yapay zekâ özeti açıksa Google Gemini yalnızca toplamları (kazanç, saat, mesafe, hedefler) alır — adınızı, yolculuklarınızı veya konumlarınızı asla almaz; kapalıysa özeti Kept kendisi yazar."],

// deductible business expenses for a period, per the country's rules and each vehicle's method
function taxBase(data, from, to) {
  const st = data.settings, country = st.country, cfg = CONFIG.tax[country];
  const vmap = {}; data.vehicles.forEach(v => vmap[v.id] = v);
  const S = data.shifts.filter(s => s.date >= from && s.date <= to);
  const E = data.expenses.filter(x => !x.recurring && x.date >= from && x.date <= to).concat(recurringIn(data, from, to));
  const usesStd = v => {
    if (!v || !cfg) return false;
    if (country === "US") return v.type === "car" && v.taxMethod !== "actual";
    if (country === "NL") return v.privateOwned !== false;
    return false;
  };
  const def = vmap[st.defaultVehicleId];
  let mileageDed = 0, stdDist = 0, ineligibleKm = 0, unconfirmed = false, depreciation = 0;
  const rateLines = {};
  S.forEach(s => {

      stdDist += d; mileageDed += d * r.rate; rateLines[r.rate] = (rateLines[r.rate] || 0) + d;
    } else {

  let actualVeh = 0, phone = 0, parking = 0, equipment = 0, other = 0;

    if (catV[x.category]) { const v = vmap[x.vehicleId] || def; if (!usesStd(v)) actualVeh += a; }

// ── Offer Intelligence: pure function so it can be unit-tested. Distances in km, times in minutes, cpk = vehicle cost per km.

  const kph = Math.max(5, i.kph || 25), totKm = i.pickupKm + i.tripKm + retKm;
  const retMins = retKm / kph * 60, totMins = i.driveMins + (i.waitMins || 0) + retMins;
  const cost = totKm * i.cpk, profit = i.pay - cost;
  const perHour = m => m > 0 ? (i.pay - cost) / (m / 60) : 0;
  const ph = perHour(totMins), pd = totKm > 0 ? profit / (totKm / (i.unitKm || 1)) : 0;

// "No tax on tips" (OBBBA §224, tax years 2025–2028): up to $25,000 of qualified tips, limited to the net profit of the
