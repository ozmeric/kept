<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body,#root{height:100%}
  body{background:#0B1220;color:#EAF2FF;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  input,select,textarea,button{font-family:inherit}
  button:disabled{opacity:.5;cursor:default}
  select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7F93B5 50%),linear-gradient(135deg,#7F93B5 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px!important}
  input[type=range]{width:100%;accent-color:#2EE6A6}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#1E2A44;border-radius:8px}
  .bottom-nav{display:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .tap:active{transform:scale(.98)}
  .pulse{animation:pulse 1.6s infinite}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,230,166,.5)}70%{box-shadow:0 0 0 10px rgba(46,230,166,0)}100%{box-shadow:0 0 0 0 rgba(46,230,166,0)}}
  @media(max-width:760px){
    .desktop-sidebar{display:none!important}
    .bottom-nav{display:flex}
    .cols{grid-template-columns:1fr}
    .grid4{grid-template-columns:1fr 1fr}
    .hide-m{display:none!important}
  }
  @media print{
    .desktop-sidebar,.bottom-nav,.no-print,header{display:none!important}
    body,#root{background:#fff!important;color:#000!important;height:auto}
    .print-area *{color:#000!important;background:transparent!important;border-color:#bbb!important}
    .app-root{height:auto!important;overflow:visible!important}
    .app-content{overflow:visible!important;padding:0!important}
    .cols{grid-template-columns:1fr 1fr}
  }
</style>

const { useState, useEffect, useRef, useMemo } = React;
const e = React.createElement;
const KM_PER_MI = 1.609344, L_PER_GAL = 3.785411784;
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (x) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (x) {} },

};
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const dISO = d => { const z = new Date(d); return z.getFullYear() + "-" + pad(z.getMonth() + 1) + "-" + pad(z.getDate()); };
const tHM = d => { const z = new Date(d); return pad(z.getHours()) + ":" + pad(z.getMinutes()); };
const num = v => { const n = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isFinite(n) ? n : 0; };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtDur = mins => { mins = Math.max(0, Math.round(mins)); return Math.floor(mins / 60) + "h " + pad(mins % 60) + "m"; };
const haversine = (a, b) => {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
};
const LOCALES = { en: "en-US", nl: "nl-NL", tr: "tr-TR" };
const WEEKDAYS_EN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const addDays = (iso, n) => { const d = new Date(iso + "T12:00"); d.setDate(d.getDate() + n); return dISO(d); };

// money / gross for a shift
const shiftGross = s => sum(s.platforms || [], p => num(p.base) + num(p.tips) + num(p.bonus));
const shiftTips  = s => sum(s.platforms || [], p => num(p.tips));
const shiftFees  = s => sum(s.platforms || [], p => num(p.fees));
const shiftMins  = s => Math.max(0, (new Date(s.end) - new Date(s.start)) / 60000);

// vehicle cost model (per km, internal unit is always km)
function vehicleCost(v) {
  if (!v) return { dep: 0, energy: 0, battery: 0, parts: 0, total: 0, fixed: 0 };
  const dep = v.leased ? 0 : (num(v.lifeKm) > 0 ? Math.max(0, num(v.purchase) - num(v.resale)) / num(v.lifeKm) : 0);
  const energy = v.energy === "none" ? 0 : num(v.cons) * num(v.price) / 100;
  const battery = num(v.battKm) > 0 ? num(v.battPrice) / num(v.battKm) : 0;
  const parts = sum(v.parts || [], p => num(p.interval) > 0 ? num(p.cost) / num(p.interval) : 0);
  const fixed = num(v.insurance) + num(v.rent) + num(v.otherFixed);
  return { dep, energy, battery, parts, total: dep + energy + battery + parts, fixed };
}
function presetVehicle(type) {
  const p = CONFIG.vehicleTypes[type];
  return {
    id: genId(), type, name: "", active: true, privateOwned: true, leased: false, taxMethod: type === "car" ? "standard" : "actual", fuelType: "petrol",
    purchase: p.purchase, resale: p.resale, valueNow: "", lifeKm: p.lifeKm, energy: p.energy, cons: p.cons, price: p.price,
    battPrice: p.battPrice, battKm: p.battKm, startOdo: 0,
    insurance: p.fixed.insurance, rent: p.fixed.rent, otherFixed: p.fixed.other,
    parts: p.parts.map(x => ({ id: genId(), name: x[0], cost: x[1], interval: x[2], lastAt: 0 })),
  };
}

// period ranges
function periodRange(key, ref) {
  const now = ref ? new Date(ref) : new Date();
  const t = dISO(now);
  if (key === "today") return [t, t];
  if (key === "week") { const d = new Date(now); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return [dISO(d), t]; }
  if (key === "month") return [t.slice(0, 8) + "01", t];
  if (key === "quarter") { const q = Math.floor(now.getMonth() / 3) * 3; return [now.getFullYear() + "-" + pad(q + 1) + "-01", t]; }
  if (key === "year") return [t.slice(0, 5) + "01-01", t];
  return ["1970-01-01", t];
}
function daysBetween(a, b) { return Math.round((new Date(b + "T12:00") - new Date(a + "T12:00")) / 86400000) + 1; }

// core economics for a date range
function computePeriod(data, from, to) {
  const { shifts, expenses, vehicles, settings } = data;
  const vmap = {}; vehicles.forEach(v => vmap[v.id] = v);
  const S = shifts.filter(s => s.date >= from && s.date <= to);
  const E = expenses.filter(x => x.date >= from && x.date <= to);
  const catV = {}; CONFIG.expenseCategories.forEach(c => catV[c.id] = c.vehicle);
  const gross = sum(S, shiftGross), tips = sum(S, shiftTips), fees = sum(S, shiftFees);
  const mins = sum(S, shiftMins), km = sum(S, s => num(s.km)), emptyKm = sum(S, s => num(s.emptyKm));
  const varCost = sum(S, s => num(s.km) * vehicleCost(vmap[s.vehicleId]).total);
  const depCost = sum(S, s => num(s.km) * vehicleCost(vmap[s.vehicleId]).dep);
  // fixed vehicle costs, pro-rata per calendar day — only from the first logged shift onward
  const firstDay = shifts.length ? shifts.reduce((m, s) => s.date < m ? s.date : m, shifts[0].date) : to;
  const effFrom = from > firstDay ? from : firstDay;
  const days = (!shifts.length || effFrom > to) ? 0 : daysBetween(effFrom, to);
  const fixed = sum(vehicles.filter(v => v.active !== false), v => vehicleCost(v).fixed) * days / 30.44;
  const vehExp = sum(E.filter(x => catV[x.category]), x => num(x.amount));
  const otherExp = sum(E.filter(x => !catV[x.category]), x => num(x.amount));
  const vehicleCosts = settings.costMode === "actual" ? vehExp + depCost : varCost + fixed;
  const costs = vehicleCosts + otherExp;
  const net = gross - fees - costs;
  const workDays = new Set(S.map(s => s.date)).size;
  return { S, E, gross, tips, fees, mins, km, emptyKm, varCost, depCost, fixed, vehExp, otherExp, vehicleCosts, costs, net, workDays,
           perHour: mins > 0 ? net / (mins / 60) : 0, per100: km > 0 ? net / km * 100 : 0, days };
}

// ── tax engines ──
function taxYear(country, year) {
  const t = CONFIG.tax[country]; if (!t) return null;
  const ys = Object.keys(t.years).map(Number).sort();
  const y = t.years[year] ? year : (year > ys[ys.length - 1] ? ys[ys.length - 1] : ys[0]);
  return Object.assign({ year: y, confirmed: !!t.years[year] }, t.years[y]);
}
function mileageRate(country, date) {
  const t = CONFIG.tax[country]; if (!t) return { rate: 0, confirmed: false };
  const r = t.mileage.find(x => date >= x.from && date <= x.to);
  if (r) return { rate: r.rate, confirmed: true };
  return { rate: t.mileage[t.mileage.length - 1].rate, confirmed: false };
}
const bracketTax = (income, br) => { let tax = 0, prev = 0; for (const [cap, rate] of br) { if (income > prev) tax += (Math.min(income, cap) - prev) * rate; prev = cap; } return tax; };
const bracketRate = (income, br) => { for (const [cap, rate] of br) if (income <= cap) return rate; return br[br.length - 1][1]; };

// deductible business expenses for a period, per the country's rules and each vehicle's method
function taxBase(data, from, to) {
  const st = data.settings, country = st.country, cfg = CONFIG.tax[country];
  const vmap = {}; data.vehicles.forEach(v => vmap[v.id] = v);
  const S = data.shifts.filter(s => s.date >= from && s.date <= to);
  const E = data.expenses.filter(x => x.date >= from && x.date <= to);
  const usesStd = v => {
    if (!v || !cfg) return false;
    if (country === "US") return v.type === "car" && v.taxMethod !== "actual";
    if (country === "NL") return v.privateOwned !== false;
    return false;
  };
  const def = vmap[st.defaultVehicleId];
  let mileageDed = 0, stdDist = 0, ineligibleKm = 0, unconfirmed = false, depreciation = 0;
  const rateLines = {};
  S.forEach(s => {
    const v = vmap[s.vehicleId]; if (!v) return;
    if (usesStd(v)) {
      const r = mileageRate(country, s.date); if (!r.confirmed) unconfirmed = true;
      const d = cfg.unit === "mi" ? num(s.km) / KM_PER_MI : num(s.km);
      stdDist += d; mileageDed += d * r.rate; rateLines[r.rate] = (rateLines[r.rate] || 0) + d;
    } else {
      depreciation += num(s.km) * vehicleCost(v).dep;
      if (country === "US" && v.type !== "car") ineligibleKm += num(s.km);
    }
  });
  const catV = {}; CONFIG.expenseCategories.forEach(c => catV[c.id] = c.vehicle);
  let actualVeh = 0, phone = 0, parking = 0, equipment = 0, other = 0;
  E.forEach(x => {
    const a = num(x.amount);
    if (catV[x.category]) { const v = vmap[x.vehicleId] || def; if (!usesStd(v)) actualVeh += a; }
    else if (x.category === "phone") phone += a;
    else if (x.category === "parking") parking += a;
    else if (x.category === "equipment") equipment += a;
    else other += a;
  });
  const gross = sum(S, shiftGross), fees = sum(S, shiftFees);
  const deductions = fees + mileageDed + depreciation + actualVeh + phone + parking + equipment + other;
  return { gross, fees, mileageDed, stdDist, rateLines, depreciation, actualVeh, phone, parking, equipment, other, deductions,
           profit: gross - deductions, ineligibleKm, unconfirmed, mins: sum(S, shiftMins) };
}

function usTax(profit, st, year) {
  const ty = taxYear("US", year), f = ty.br[st.filing] ? st.filing : "single", br = ty.br[f], std = ty.std[f];
  const w2 = num(st.otherIncome), p = Math.max(0, profit);
  const seBase = p * 0.9235;
  const se = seBase < 400 ? 0 : Math.min(seBase, Math.max(0, ty.ssBase - w2)) * 0.124 + seBase * 0.029;
  const halfSE = se / 2;
  const tiBeforeQbi = Math.max(0, w2 + p - halfSE - std);
  const qbi = Math.min(0.2 * Math.max(0, p - halfSE), 0.2 * tiBeforeQbi);
  const tiWith = Math.max(0, tiBeforeQbi - qbi), tiWithout = Math.max(0, w2 - std);
  const fed = Math.max(0, bracketTax(tiWith, br) - bracketTax(tiWithout, br));
  const stObj = US_STATES.find(s => s.code === st.state);
  const stateRate = stObj && stObj.noTax ? 0 : num(st.stateRate) / 100;
  const state = p * stateRate;
  const total = se + fed + state;
  return { se, fed, state, total, qbi, halfSE, eff: p > 0 ? total / p : 0, marginal: bracketRate(tiWith, br) * 0.8 + 0.153 * 0.9235 + stateRate, confirmed: ty.confirmed, year: ty.year };
}
function nlTax(profit, st, year, meetsHours) {
  const ty = taxYear("NL", year), other = num(st.otherIncome), p = Math.max(0, profit);
  const za = meetsHours ? Math.min(ty.za, p) : 0;
  const afterZa = p - za;
  const mkb = ty.mkb * Math.max(0, afterZa);
  const taxable = Math.max(0, afterZa - mkb);
  const box1 = bracketTax(other + taxable, ty.br) - bracketTax(other, ty.br);
  const zvw = ty.zvw * Math.max(0, Math.min(other + taxable, ty.zvwCap) - Math.min(other, ty.zvwCap));
  const total = box1 + zvw;
  return { za, mkb, taxable, box1, zvw, total, eff: p > 0 ? total / p : 0, marginal: bracketRate(other + taxable, ty.br) * (1 - ty.mkb) + ty.zvw, confirmed: ty.confirmed, year: ty.year };
}
function nlHoursStatus(data, year) {
  const from = year + "-01-01", isThis = String(year) === String(new Date().getFullYear());
  const to = isThis ? dISO(new Date()) : year + "-12-31";
  const hrs = sum(data.shifts.filter(s => s.date >= from && s.date <= to), shiftMins) / 60;
  const doy = daysBetween(from, to), diy = daysBetween(from, year + "-12-31");
  const projected = isThis ? hrs / doy * diy : hrs;
  const need = (taxYear("NL", year) || { hours: 1225 }).hours;
  const st = data.settings.nlHours;
  return { hrs, projected, need, meets: st === "yes" ? true : st === "no" ? false : projected >= need };
}
// full-year estimate on profit year-to-date
function taxEstimate(data, year, profitOverride) {
  const st = data.settings, from = year + "-01-01";
  const to = String(year) === String(new Date().getFullYear()) ? dISO(new Date()) : year + "-12-31";
  const base = taxBase(data, from, to);
  const profit = profitOverride != null ? profitOverride : base.profit;
  if (st.country === "US") return Object.assign({ base, profit }, usTax(profit, st, +year));
  if (st.country === "NL") { const h = nlHoursStatus(data, year); return Object.assign({ base, profit, hours: h }, nlTax(profit, st, +year, h.meets)); }
  const p = num(st.setAsidePct) / 100;
  return { base, profit, total: Math.max(0, profit) * p, eff: p, marginal: p, confirmed: true };
}
// effective set-aside rate to apply to any period's net
function setAsideRate(data) {
  if (data.settings.country === "OTHER") return num(data.settings.setAsidePct) / 100;
  const t = taxEstimate(data, new Date().getFullYear());
  if (!(t.profit > 50)) return clamp(t.marginal || 0.25, 0, 0.6);   // not enough profit yet — use marginal rate
  return clamp(t.eff, 0, 0.6);
}

// ── burnout + coach ──
function burnoutScore(data) {
  const today = dISO(new Date()), from = addDays(today, -6);
  const S7 = data.shifts.filter(s => s.date >= from && s.date <= today);
  const h7 = sum(S7, shiftMins) / 60, hToday = sum(S7.filter(s => s.date === today), shiftMins) / 60;
  const days = new Set(data.shifts.map(s => s.date));
  let streak = 0, d = days.has(today) ? today : addDays(today, -1);
  while (days.has(d)) { streak++; d = addDays(d, -1); }
  let nightMin = 0, totMin = 0;
  S7.forEach(s => { const a = new Date(s.start).getTime(), b = new Date(s.end).getTime();
    for (let t = a; t < b; t += 300000) { const h = new Date(t).getHours(); totMin += 5; if (h >= 22 || h < 5) nightMin += 5; } });
  const night = totMin ? nightMin / totMin : 0;
  const parts = { h7: clamp((h7 - 35) / 35, 0, 1) * 40, streak: clamp((streak - 4) / 6, 0, 1) * 25, today: clamp((hToday - 8) / 5, 0, 1) * 20, night: clamp(night / 0.4, 0, 1) * 15 };
  const score = Math.round(parts.h7 + parts.streak + parts.today + parts.night);
  return { score, h7, hToday, streak, night, parts, level: score >= 65 ? "high" : score >= 35 ? "watch" : "fresh" };
}
function plannerTargets(data) {
  const st = data.settings, living = num(st.livingCosts), wd = clamp(num(st.workDays) || 5, 1, 7);
  if (!(living > 0)) return null;
  const rate = setAsideRate(data);
  const monthNet = living / Math.max(0.2, 1 - rate);            // economic net needed before tax
  const dailyNet = monthNet / (wd * 4.345);
  const P30 = computePeriod(data, addDays(dISO(new Date()), -29), dISO(new Date()));
  const ratio = P30.net > 0 && P30.gross > P30.net ? P30.gross / P30.net : 1.35;
  return { monthNet, dailyNet, dailyGross: dailyNet * ratio, weekNet: dailyNet * wd, rate, ratio, living, wd };
}

function parseAmount(s) {

  const dec = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
  if (dec < 0) return num(s);
  return num(s.slice(0, dec).replace(/[.,]/g, "") + "." + s.slice(dec + 1));
}
function parseReceipt(text, country) {
  const out = {};
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const amtRe = /(\d{1,4}(?:[.,]\d{3})*[.,]\d{2})(?!\d)/g;
  const all = [], totals = [];
  lines.forEach(l => {
    const vals = (l.match(amtRe) || []).map(parseAmount).filter(v => v > 0 && v < 5000);
    vals.forEach(v => all.push(v));
    if (/(tota+l|toplam|te\s*betalen|amount|bedrag|balance|\bsum\b|genel|\bpin\b|card|kaart)/i.test(l) && !/sub\s*-?\s*tot/i.test(l)) vals.forEach(v => totals.push(v));
  });
  if (totals.length) out.amount = Math.max.apply(null, totals); else if (all.length) out.amount = Math.max.apply(null, all);
  const t = text.replace(/\s+/g, " ");
  let m = t.match(/(20\d{2})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) out.date = m[1] + "-" + pad(+m[2]) + "-" + pad(+m[3]);
  else if ((m = t.match(/\b(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})\b/))) {
    let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
    let mo = country === "US" ? a : b, d = country === "US" ? b : a;
    if (mo > 12 && d <= 12) { const tmp = mo; mo = d; d = tmp; }
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && y >= 2015 && y <= 2100) out.date = y + "-" + pad(mo) + "-" + pad(d);
  }
  if ((m = t.match(/(\d{1,3}[.,]\d{1,3})\s*(l|ltr|liter|litre|lt)\b/i))) out.qty = parseAmount(m[1]);
  else if ((m = t.match(/(\d{1,3}[.,]\d{1,3})\s*(gal|gallons?)\b/i))) out.qty = +(parseAmount(m[1]) * L_PER_GAL).toFixed(2);
  else if ((m = t.match(/(\d{1,3}(?:[.,]\d{1,3})?)\s*kwh/i))) out.qty = parseAmount(m[1]);
  const low = t.toLowerCase();
  if (/(kwh|charg|laadpaal|fastned|ionity|supercharg|electrify|allego|shell recharge)/.test(low)) out.category = "electricity";
  else if (/(shell|\bbp\b|esso|tinq|tango|totalenergies|texaco|chevron|exxon|mobil|wawa|sheetz|speedway|circle k|benzine|euro ?95|diesel|unleaded|gasoline|\bfuel\b|petrol|opet|\baral\b|argos|gulf|sunoco|marathon|valero|quiktrip|costco gas)/.test(low)) out.category = "fuel";
  else if (/(parking|parkeren|parkeer|\btoll|\btol\b|otopark|ez-?pass|sunpass)/.test(low)) out.category = "parking";
  else if (/(tire|tyre|banden|lastik|brake|remblok|oil change|jiffy|halfords|bike shop|fietsenmaker)/.test(low)) out.category = "maintenance";
  else if (/(vodafone|kpn|t-mobile|odido|verizon|at&t|turkcell|lebara|simyo)/.test(low)) out.category = "phone";
  return out;
}

  useEffect(() => {
    let alive = true, made = null;
    (async () => {
      try {
        let blob = await IDB.get(id);
        if (!blob && CONFIG.apiUrl && pin) {
          const r = await apiCall(pin, "getPhoto", { id });
          if (r && r.data) { blob = b64ToBlob(r.data, r.mime); IDB.put(id, blob).catch(() => {}); }
        }
