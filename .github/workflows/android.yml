# Builds the Kept Android app in the cloud. No Android Studio needed.
# Run it: GitHub → Actions → "Build Kept Android" → Run workflow. When it finishes (about 8 minutes),
# download "kept-android" at the bottom of the run page and install app-debug.apk on your phone.
# For a Google Play upload, add the four KEYSTORE secrets (see android/README-ANDROID.md); the run then also
# produces a signed app-release.aab.
name: Build Kept Android
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Site the app opens"
        default: "https://kept.usebuildflow.io"
        required: true
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: write        # lets the main-branch build publish kept.apk as a release download
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "21" }
      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME); just accept its licences
      - name: Android SDK licences and API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
      - name: Create the Android project
        working-directory: android
        env:
          KEPT_URL: ${{ github.event.inputs.site_url || 'https://kept.usebuildflow.io' }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "6.1.${{ github.run_number }}"
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash setup-android.sh
      - name: Build debug APK
        working-directory: android/android
        run: ./gradlew --no-daemon assembleDebug
      - name: Check what was built (Android target, permissions, components)
        run: |
          APK=android/android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|^minSdkVersion|^sdkVersion|^targetSdkVersion|uses-permission" | tee badging.txt
          grep -q "targetSdkVersion:'36'" badging.txt
          grep -qE "^(minSdkVersion|sdkVersion):'24'" badging.txt
          for p in ACCESS_BACKGROUND_LOCATION FOREGROUND_SERVICE_LOCATION RECEIVE_BOOT_COMPLETED POST_NOTIFICATIONS; do grep -q "$p" badging.txt || { echo "missing permission $p"; exit 1; }; done
          "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml > manifest.txt
          for c in TrackingService BootReceiver GigNotificationListener KeptWidget ActionReceiver; do grep -q "io.usebuildflow.kept.$c" manifest.txt || { echo "missing component $c"; exit 1; }; done
          unzip -l "$APK" | grep -c "classes.*dex"
          "$BT/dexdump" -f "$APK" 2>/dev/null | grep -c "FusedLocationProviderClient" || true
          echo "Build check passed"
      - name: Build the signed app (only when the signing secrets exist)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.keystore -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          ./gradlew --no-daemon assembleRelease bundleRelease $SIGN
          rm "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "SHA-256|Signer #1 certificate DN"
      - uses: actions/upload-artifact@v4
        with:
          name: kept-android
          path: |
            android/android/app/build/outputs/apk/debug/app-debug.apk
            android/android/app/build/outputs/apk/release/app-release.apk
            android/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
      - name: Publish kept.apk for drivers (main branch only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # the signed app when the signing key is set up (installs over earlier signed versions); the debug build otherwise
          REL=android/android/app/build/outputs/apk/release/app-release.apk
          if [ -f "$REL" ]; then cp "$REL" kept.apk; else cp android/android/app/build/outputs/apk/debug/app-debug.apk kept.apk; fi
          if ! gh release view android --repo "$REPO" > /dev/null 2>&1; then
            gh release create android --repo "$REPO" --title "Kept for Android" --target "$GITHUB_SHA" \
              --notes "Install file for drivers. Direct link: https://github.com/$REPO/releases/download/android/kept.apk — see https://kept.usebuildflow.io/android.html"
          fi
          gh release upload android kept.apk --clobber --repo "$REPO"
          echo "Published https://github.com/$REPO/releases/download/android/kept.apk"
