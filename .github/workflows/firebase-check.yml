name: Service check
on: { push: { branches: [firebase-check] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Exact Code.gs requests
        run: |
          echo "== CBS newest row"; curl -s "https://opendata.cbs.nl/ODataApi/odata/80416NED/TypedDataSet?$filter=Perioden%20ge%20'20261013'" | jq -c '[.value[] | select(.Perioden|test("^[0-9]{8}$"))] | sort_by(.Perioden) | last'
          echo "== VIN"; curl -s "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/4T1B11HK4KU236014?format=json" | jq -c '.Results[0] | {ModelYear, Make, Model, ErrorCode}'
